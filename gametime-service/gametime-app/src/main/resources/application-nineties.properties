# Nineties era profile - a DELTA over baseline, not a replacement.
#
#     spring.profiles.active=local,baseline,nineties      (app)
#     -Dspring.profiles.active=test,baseline,nineties     (harness)
#
# Without baseline in the list most properties are unbound and the context fails
# at startup. Order is positional: listing baseline last makes it win and this
# file do nothing. Never stack two era profiles.
#
# ILLUSTRATIVE, NOT CALIBRATED. Nothing is tuned against a non-baseline profile
# and no calibration target applies to one. This file shows the mechanism works
# and that an era reads differently; it is not a claim about 1990s basketball.
# Do not tune these values or treat a run under this profile as a result.
#
# The era it gestures at: low pace, few threes, more post play, more contact,
# more offensive rebounding, more turnovers.

# --- Pace ---------------------------------------------------------------
# Also the divisor behind the technical-foul rate, so this lowers technicals too.
sim.default-possessions-per-period=21

# --- Shooting: fewer and worse threes, more post work --------------------
sim.base-three=0.3200
sim.base-post=0.5150
sim.base-drive=0.5875
# Fewer assisted buckets - more isolation and post-up offense.
sim.base-assist=0.5700

# --- Contact: hand-checking was legal, so more fouls all round -----------
# Raising this REMOVES points (era-correct here, but not a scoring knob).
sim.base-no-basket-foul=0.175
sim.foul-mult-perimeter=0.42
sim.foul-mult-three=0.160

# --- The glass: more misses, more bodies, more second chances ------------
sim.base-offensive-rebound=0.31
sim.rebound-foul-base=0.062

# --- Turnovers: rougher perimeter defense forced more of them ------------
sim.base-turnover=0.043

# --- Shot mix: the clause this file could never express before -----------
# §3.17 (decisions.md #040 L). The header has always claimed "few threes", and
# until now the only lever was base-three - which is how often a three GOES IN,
# a different thing entirely. These four make the claim mean what it says: a
# genuinely two-heavy mix, with the mid-range jumper the era's staple shot
# rather than the shot the modern game trades away.
#
# ! ILLUSTRATIVE AND UNCALIBRATED, like everything else in this file (#035 D).
# Nothing is tuned against a non-baseline profile and no target applies to one.
# These are a demonstration that the mechanism works, not a claim about the
# 1990s. Do not tune them and do not read a run under this profile as a result.
sim.shot-share-drive=1.0
sim.shot-share-perimeter=1.15
sim.shot-share-post=0.95
sim.shot-share-three=0.30
