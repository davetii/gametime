# Baseline sim profile - the tunable simulation constants and their only copy.
#
# The matching SimConfig fields have no initializers, so a key missing from here
# fails the Spring context at startup. Values are not duplicated in Java.
#
# Baseline is the modern-calibrated config. Era profiles are deltas layered over
# it (spring.profiles.active=local,baseline,nineties), so baseline must always be
# in the list, and order is positional - listing it last neutralizes the era file.
#
# Not in this file: the rules and model machinery on SimConfig (periods, free-throw
# counts, ejection limits, the scale definitions and the sensitivities). A profile
# cannot set those. Unrecognized sim.* keys are ignored silently.
#
# Keys are kebab-case by convention; relaxed binding also accepts other forms.
# Full prose for each constant is on the SimConfig accessor javadoc.
#
# ASCII only - .properties is read as ISO-8859-1 by Properties.load().

# --- Pace / game structure ---------------------------------------------
sim.default-possessions-per-period=25
sim.ot-possessions-per-period=5

# --- Shooting ----------------------------------------------------------
# Make rates at an average contest. The main lever on points and FG%,
# which move together: trimming one trims the other.
sim.base-drive=0.5975
sim.base-perimeter=0.4375
sim.base-three=0.3375
sim.base-post=0.4975
sim.base-assist=0.62

# --- Fouls and free throws ---------------------------------------------
# base-no-basket-foul is the DRIVE probability; the four foul-mult-* are
# MULTIPLIERS on it, not probabilities (three = 0.133 means 13.3% of a
# drive's rate). Raising base-no-basket-foul LOWERS points - a stopped shot
# is worth less than the live shot it replaces.
sim.base-no-basket-foul=0.15
sim.foul-mult-drive=1.0
sim.foul-mult-post=1.0
sim.foul-mult-perimeter=0.30
sim.foul-mult-three=0.133
sim.and-one-base=0.055
sim.ft-base=0.75
sim.bonus-fouls-per-period=5
sim.foul-out-limit=6
# non-shooting-foul-share is a SECOND roll on a foul already rolled and
# charged, so it re-partitions SHOOTING_FOUL into NON_SHOOTING_FOUL without moving
# the foul total. It is BACK-SOLVED, NOT SOURCED: it is the value that lands
# FTA on its sourced target, not a measured NBA share. Raising it LOWERS FTA
# and points; it does NOT lower the foul count.
sim.non-shooting-foul-share=0.50

# --- Rebounding and loose balls ----------------------------------------
# The weight groups are raw and normalized at the call site, so only ratios
# matter: oob-defense/offense, the four block-* weights, and the two
# rebound-foul-* weights. oob-total-weight is an absolute share of misses.
sim.base-offensive-rebound=0.27
sim.max-offensive-retentions-per-possession=3
sim.oob-total-weight=0.07
sim.oob-defense-weight=0.60
sim.oob-offense-weight=0.40
sim.base-block-drive=0.056
sim.base-block-post=0.048
sim.base-block-perimeter=0.023
sim.base-block-three=0.005
sim.block-recovered-defense=0.45
sim.block-recovered-offense=0.30
sim.block-oob-defense=0.13
sim.block-oob-offense=0.12
sim.rebound-foul-base=0.055
sim.rebound-foul-defense-weight=0.75
sim.rebound-foul-offense-weight=0.25

# --- Turnovers ---------------------------------------------------------
# The nine to-weight-* re-partition a turnover that already happened: they
# shift the mix, never the count. Only base-turnover moves the count.
sim.base-turnover=0.038
sim.to-weight-stolen=56.0
sim.to-weight-shot-clock=10.0
sim.to-weight-offensive-foul=9.0
sim.to-weight-bad-pass=8.0
sim.to-weight-travelling=6.0
sim.to-weight-lost-ball-oob=4.0
sim.to-weight-three-seconds=3.0
sim.to-weight-eight-seconds-backcourt=2.0
sim.to-weight-over-and-back=2.0

# --- Fatigue and rotation ----------------------------------------------
# Energy points (0..MAX_ENERGY=100): energy-drain, energy-recovery,
# base-sub-energy-threshold, starter-sub-threshold-bonus,
# foul-trouble-freshness-margin. The rest are multipliers or fractions.
# foul-trouble-sit-probabilities is indexed by foul count and must have
# EXACTLY 7 entries; it is measured saturated, so raising it does not move
# foul-outs. foul-trouble-freshness-margin is an optimum, not a maximum -
# larger values make foul-outs worse by vetoing legitimate sits.
sim.energy-drain-per-possession=2.6
sim.energy-recovery-per-possession=5.5
sim.min-drain-scale=0.25
sim.fatigue-max-penalty=0.28
sim.base-sub-energy-threshold=62.0
sim.starter-sub-threshold-bonus=8.0
sim.base-rotation-depth=4
sim.foul-trouble-sit-probabilities=0.0,0.0,0.0,0.120,0.500,0.900,0.0
sim.foul-trouble-starter-bonus=0.15
sim.foul-trouble-bench-discount-per-slot=0.05
sim.foul-trouble-min-roster-factor=0.70
sim.foul-trouble-freshness-margin=1.0

# --- Rare events -------------------------------------------------------
# The first two are PER-TEAM-PER-GAME RATES, not probabilities; the engine
# derives the per-check rate. flagrant-two-share is a conditional share of
# an already-rare parent and is not independently resolvable. All three are
# unsourced ballparks, not targets - judge them at 5 seeds only.
# The flagrant divisor (PERSONAL_FOULS_PER_TEAM_GAME) is a measured static,
# not in this file, so a profile that moves the foul rate moves flagrants.
sim.technical-fouls-per-team-game=0.35
sim.flagrant-fouls-per-team-game=0.16
sim.flagrant-two-share=0.15

# --- Shot mix (§3.17, decisions.md #040 C/K) ----------------------------
# The league's base distribution over the four ShotTypes. RAW WEIGHTS,
# normalized at the call site (the to-weight-* / block-* convention) - only
# RATIOS matter, so a profile author never has to make them sum to 1.
#
# BEFORE §3.17 THE MIX WAS EMERGENT AND UNTUNABLE. It fell out of the four
# skill calculators via a weight formula that gave DRIVE the SUM of two skills
# and the other three types one each (#040 A/B), structurally predicting a 20%
# three share against a real 41.5%. These four values are what make it a
# calibration surface at all.
#
# ! THESE ARE SHARES OF *DRAWS*, NOT OF CHARGED ATTEMPTS. A stopped shot
# charges no FGA and foul-mult-three (0.133) is 7.5x below DRIVE's 1.0, so a
# three converts to a charged attempt more often than a drive does. The three
# DRAW share must therefore sit BELOW the target share of ATTEMPTS - do not set
# these to the target percentages and expect them back out (#040 E/K).
#
# ! TUNE AGAINST THE MEASURED 3PA LINE AT 5 SEEDS. The landing is the target,
# not the constant. The harness's "Shot-type mix" block prints both the CHARGED
# and the DRAW share so the two are never confused.
sim.shot-share-drive=1.0
sim.shot-share-perimeter=0.55
sim.shot-share-post=0.55
sim.shot-share-three=1.23
