openapi: 3.0.0
info:
  description: Gametime API
  version: "1.0.0"
  title: Gametime API
  contact:
    email: davetii@gmail.com
  license:
    name: Apache 2.0
    url: 'http://www.apache.org/licenses/LICENSE-2.0.html'

servers:
  - url: http://localhost:8080/api
    description: Local Server

paths:
  /v1/league:
    get:
      summary: list of all teams, players in league
      description: a list of all **Actors** in the league
      tags:
        - Team
      operationId: fetchLeaguev1
      responses:
        '200':
          description: list of all teams, players in league
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"

  /v1/team/{teamId}:
    get:
      summary: fetch Team by id
      tags:
        - Team
      operationId: fetchTeam
      parameters:
        - $ref: "#/components/parameters/teamIdPathParam"
      responses:
        '200':
          description: Found Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        '404':
          description: Not Found

  /v1/team/{teamId}/{playerId}:
    post:
      summary: Add Player to Team
      description: Add Player to Team
      operationId: addPlayerToTeam
      tags:
        - Team
      parameters:
        - $ref: "#/components/parameters/teamIdPathParam"
        - $ref: "#/components/parameters/playerIdPathParam"
      responses:
        '200':
          description: Team Updated
        '409':
          description: Player already on a team
        '404':
          description: Not Found
    delete:
      summary: Release Player from Team
      description: Remove the player from the team's roster (release to free
        agency). The player_team row is removed and a RELEASE transaction is
        appended to history; past stints stay queryable via /history.
      operationId: removePlayerFromTeam
      tags:
        - Team
      parameters:
        - $ref: "#/components/parameters/teamIdPathParam"
        - $ref: "#/components/parameters/playerIdPathParam"
      responses:
        '200':
          description: Player released
        '404':
          description: Team, player, or assignment not found

  /v1/team/{teamId}/lineup:
    put:
      summary: Set the team lineup (starting 5 + rotation order)
      description: Replace-all. The request must describe every roster player's
        lineup role and rotation order; exactly 5 entries must be STARTER.
      operationId: setLineup
      tags:
        - Team
      parameters:
        - $ref: "#/components/parameters/teamIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupRequest"
      responses:
        '200':
          description: Lineup updated — returns the team with its updated roster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        '400':
          description: Invalid lineup (not exactly 5 starters, duplicate player,
            a starter with a rotation order, or a duplicate rotation order)
        '404':
          description: Team not found, or a player is not on this team

  /v1/player/:
    put:
      summary: Update Player
      description: Update player
      operationId: updatePlayer
      tags:
        - Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Player"
      responses:
        '200':
          description: Player Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        '404':
          description: Not Found
    post:
      summary: Create Player
      description: Create
      operationId: createPlayer
      tags:
        - Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Player"
      responses:
        '200':
          description: Player Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"

  /v1/player/{playerId}:
    get:
      summary: fetch player by id
      tags:
        - Player
      operationId: readPlayer
      parameters:
        - $ref: "#/components/parameters/playerIdPathParam"
      responses:
        '200':
          description: Found Player
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Player"
        '404':
          description: Not Found

  /v1/player/{playerId}/history:
    get:
      summary: fetch a player's roster transaction history
      description: a list of the player's team assignments over time, most recent first
      tags:
        - Player
      operationId: fetchPlayerHistory
      parameters:
        - $ref: "#/components/parameters/playerIdPathParam"
      responses:
        '200':
          description: Player roster history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlayerTransaction"
        '404':
          description: Not Found

  /v1/game/simulate:
    post:
      summary: Simulate a game between two teams
      description: Run the game engine for a home/away matchup and persist the
        result. An optional seed makes the run reproducible; omitted, a fresh
        random seed is rolled and persisted on the returned game (#024 B).
      operationId: simulateGame
      tags:
        - Game
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateGameRequest"
      responses:
        '200':
          description: Game simulated — the game header plus both teams' box scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResult"
        '404':
          description: Unknown home or away team
        '422':
          description: Same-team matchup (homeTeamId equals awayTeamId)

  /v1/game/{gameId}:
    get:
      summary: fetch a simulated game by id
      tags:
        - Game
      operationId: fetchGame
      parameters:
        - $ref: "#/components/parameters/gameIdPathParam"
      responses:
        '200':
          description: The game header plus both teams' box scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameResult"
        '404':
          description: Not Found

  /v1/game/{gameId}/play-by-play:
    get:
      summary: fetch a game's play-by-play event log
      description: the game's events as a flat list in sequence order (#024 D)
      tags:
        - Game
      operationId: fetchPlayByPlay
      parameters:
        - $ref: "#/components/parameters/gameIdPathParam"
      responses:
        '200':
          description: Ordered play-by-play events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameEvent"
        '404':
          description: Not Found

  /v1/player/{playerId}/stats:
    get:
      summary: a player's aggregate stats over all FINAL games
      tags:
        - Stats
      operationId: fetchPlayerStats
      parameters:
        - $ref: "#/components/parameters/playerIdPathParam"
      responses:
        '200':
          description: Totals, per-game averages and shooting percentages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerStats"
        '404':
          description: Not Found

  /v1/player/{playerId}/gamelog:
    get:
      summary: a player's game-by-game lines, oldest first
      tags:
        - Stats
      operationId: fetchPlayerGameLog
      parameters:
        - $ref: "#/components/parameters/playerIdPathParam"
      responses:
        '200':
          description: One entry per game, ordered by playedAt then game id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameLogEntry"
        '404':
          description: Not Found

  /v1/team/{teamId}/stats:
    get:
      summary: a team's and its opponents' aggregate stats over all FINAL games
      tags:
        - Stats
      operationId: fetchTeamStats
      parameters:
        - $ref: "#/components/parameters/teamIdPathParam"
      responses:
        '200':
          description: Team and opponent totals, per-game, pace and ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamStats"
        '404':
          description: Not Found

  /v1/league/leaders:
    get:
      summary: league leaders in one category
      tags:
        - Stats
      operationId: fetchLeaders
      parameters:
        - in: query
          name: category
          required: true
          schema:
            $ref: "#/components/schemas/LeaderCategory"
        - $ref: "#/components/parameters/limitParam"
      responses:
        '200':
          description: Ranked qualifying players; empty when nobody qualifies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeaderBoard"
        '400':
          description: Unknown category or limit out of range

  /v1/league/game-highs:
    get:
      summary: the best single-game lines in one counting stat
      tags:
        - Stats
      operationId: fetchGameHighs
      parameters:
        - in: query
          name: category
          required: true
          schema:
            $ref: "#/components/schemas/GameHighCategory"
        - $ref: "#/components/parameters/limitParam"
      responses:
        '200':
          description: Ranked single-game lines; a player may appear more than once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameHighs"
        '400':
          description: Unknown category or limit out of range

components:

  parameters:

    pageNumberParam:
      in: query
      description: Page number
      name: pageNumber
      schema:
        type: integer
        format: int32
        default: 1

    pageSizeParam:
      in: query
      description: Page Size
      name: pageSize
      required: false
      schema:
        type: integer
        format: int32
        default: 25

    playerIdPathParam:
      in: path
      description: Player Id
      name: playerId
      required: true
      schema:
        type: string

    teamIdPathParam:
      in: path
      description: Team ID
      name: teamId
      required: true
      schema:
        type: string

    gameIdPathParam:
      in: path
      description: Game ID
      name: gameId
      required: true
      schema:
        type: string



    limitParam:
      in: query
      description: How many entries to return (1 to the configured maximum, 100)
      name: limit
      required: false
      schema:
        type: integer
        format: int32

  schemas:
    Team:
      type: object
      description: A group of individuals representing a locale
      properties:
        id:
          type: string
          readOnly: true
          enum: [NY, PHI, BOS, CONN, JACK, NC, WASH, ATL, BRK, MIA, 
                 MI, CHI, TOR, VA, IND, CLEV, MIN, PIT, MIL, BUF,
                 TENN, KC, STL, HOU, SA, NOLA, DAL, DEN, OKL, AL, 
                 SD, LA, PHO, CA, POR, SF, SEA, UT, VAN, LV]
        players:
          type: array
          description: The team's roster — each player with their lineup slot
            (role + rotation order). This is the team's full state w.r.t. players.
          items:
            $ref: "#/components/schemas/RosterEntry"
        locale:
          type: string
        name:
          type: string
        coach:
          $ref: "#/components/schemas/Coach"
        gm:
          $ref: "#/components/schemas/GM"
        conference:
          type: string
          enum: [EAST, NORTH, SOUTH, WEST]

    Coach:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        pace:
          type: integer
          format: int32
          description: Decision-making attribute (1-20, avg 10). Possessions per
            game / shot-clock urgency. Read by the Phase 3 engine.
        offensiveScheme:
          type: integer
          format: int32
          description: Decision-making attribute (1-20, avg 10). Shot distribution
            — perimeter/3pt lean vs. inside/post.
        defensiveScheme:
          type: integer
          format: int32
          description: Decision-making attribute (1-20, avg 10). Defensive
            aggressiveness — pressure/steal-seeking vs. contain.
        rotationDepth:
          type: integer
          format: int32
          description: Decision-making attribute (1-20, avg 10). How many players
            see real minutes (tight vs. deep rotation).
        substitutionAggressiveness:
          type: integer
          format: int32
          description: Decision-making attribute (1-20, avg 10). How early/eagerly
            fatigued starters are pulled.

    GM:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string

    Player:
      type: object
      description: Player
      properties:
        id:
          type: string
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        firstName:
          type: string
          example: Bob
        lastName:
          type: string
          example: Johnson
        position:
          type: string
          enum: [PG, CG, SG, W, SF, F, PF, FC, C]
        status:
          type: string
          description: Player availability — intrinsic to the player, independent
            of any team. Lineup slot lives in player_team.lineupRole, not here.
          enum: [ACTIVE, INJURED, SUSPENDED]
        currentTeamId:
          type: string
          readOnly: true
          description: The team the player is currently on, or null if a free agent. Derived from the current roster assignment.
        height:
          type: string
        weight:
          type: integer
        draftSlot:
          type: string
        yearsPro:
          type: integer
        origin:
          type: string
        agility:
          type: integer
          format: int32
        charisma:
          type: integer
          format: int32
        cohesion:
          type: integer
          format: int32
        determination:
          type: integer
          format: int32
        ego:
          type: integer
          format: int32
        endurance:
          type: integer
          format: int32
        energy:
          type: integer
          format: int32
        handle:
          type: integer
          format: int32
        health:
          type: integer
          format: int32
        intelligence:
          type: integer
          format: int32
        luck:
          type: integer
          format: int32
        shotSelection:
          type: integer
          format: int32
        shotSkill:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        speed:
          type: integer
          format: int32
        strength:
          type: integer
          format: int32
        verticality:
          type: integer
          format: int32
        wingspan:
          type: integer
          format: int32
        composure:
          type: integer
          format: int32
        aggression:
          type: integer
          format: int32
        awareness:
          type: integer
          format: int32
        skills:
          $ref: "#/components/schemas/PlayerSkills"

    PlayerSkills:
      type: object
      description: Player Skill Set
      properties:
        acumen:
          type: number
        ballSecurity:
          type: number
        passing:
          type: number
        teamOffense:
          type: number
        drive:
          type: number
        freeThrows:
          type: number
        longRange:
          type: number
        perimeter:
          type: number
        post:
          type: number
        individualDefense:
          type: number
        teamDefense:
          type: number
        offenseRebound:
          type: number
        defenseRebound:
          type: number
        finishing:
          type: number
        transition:
          type: number
        rimProtection:
          type: number
        stealing:
          type: number
        shotContest:
          type: number
        foulDrawing:
          type: number
        foulProne:
          type: number
        clutch:
          type: number
        screenSetting:
          type: number
        offBallMovement:
          type: number

    PlayerTransaction:
      type: object
      description: A single roster transaction (a player joining a team)
      properties:
        playerId:
          type: string
        teamId:
          type: string
        transactionType:
          type: string
          enum: [SEED, DRAFT, TRADE, FREE_AGENCY, WAIVER, SIGN, RELEASE]
        transactionDate:
          type: string
          format: date-time

    LineupRole:
      type: string
      description: A player's slot on a specific team's roster/lineup.
      enum: [STARTER, ROTATION, BENCH, INACTIVE, MINORS]

    RosterEntry:
      type: object
      description: One player on a team's roster, with their lineup slot.
      properties:
        player:
          $ref: "#/components/schemas/Player"
        lineupRole:
          $ref: "#/components/schemas/LineupRole"
        rotationOrder:
          type: integer
          format: int32

    LineupEntry:
      type: object
      description: A requested lineup slot for one player.
      required:
        - playerId
        - lineupRole
      properties:
        playerId:
          type: string
        lineupRole:
          $ref: "#/components/schemas/LineupRole"
        rotationOrder:
          type: integer
          format: int32

    LineupRequest:
      type: object
      description: Replace-all lineup for a team. Must include every roster
        player; exactly 5 entries must be STARTER.
      required:
        - entries
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LineupEntry"

    SimulateGameRequest:
      type: object
      description: Request to simulate a game (#024). Pace is not exposed — the
        engine always uses its default possessions-per-period (#024 C).
      required:
        - homeTeamId
        - awayTeamId
      properties:
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        seed:
          type: integer
          format: int64
          description: Optional RNG seed for a reproducible run. Omitted, a fresh
            random seed is rolled and persisted on the game (#024 B).

    Game:
      type: object
      description: A simulated game's header — matchup, outcome, and the seed it
        was run with. No per-period line scores (derivable from the event log,
        #020). Only FINAL is produced by the engine.
      properties:
        id:
          type: string
        homeTeamId:
          type: string
        awayTeamId:
          type: string
        status:
          type: string
          enum: [SCHEDULED, IN_PROGRESS, FINAL]
        homeScore:
          type: integer
          format: int32
        awayScore:
          type: integer
          format: int32
        periods:
          type: integer
          format: int32
        seed:
          type: integer
          format: int64

    BoxScore:
      type: object
      description: A single player's stat line for one game.
      properties:
        playerId:
          type: string
        points:
          type: integer
          format: int32
        offensiveRebounds:
          type: integer
          format: int32
        defensiveRebounds:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        steals:
          type: integer
          format: int32
        blocks:
          type: integer
          format: int32
        turnovers:
          type: integer
          format: int32
        fouls:
          description: >-
            Personal fouls only. Technicals are counted separately in
            technicalFouls (#032 E) — a technical does not count toward the
            six-foul disqualification.
          type: integer
          format: int32
        technicalFouls:
          description: >-
            Technical fouls (§3.14a, decisions.md #032 E). Separate from fouls
            because a technical does not feed the six-foul limit or the period
            bonus tally. Two in a game is an automatic ejection.
          type: integer
          format: int32
        minutes:
          type: integer
          format: int32
        fieldGoalsAttempted:
          type: integer
          format: int32
        fieldGoalsMade:
          type: integer
          format: int32
        threePointersAttempted:
          type: integer
          format: int32
        threePointersMade:
          type: integer
          format: int32
        freeThrowsAttempted:
          type: integer
          format: int32
        freeThrowsMade:
          type: integer
          format: int32

    GameEvent:
      type: object
      description: One event in a game's play-by-play log, in sequence order.
        No time field — a display clock is derived on read (#024 E).
      properties:
        sequence:
          type: integer
          format: int32
        period:
          type: integer
          format: int32
        offenseTeamId:
          type: string
        defenseTeamId:
          type: string
        playType:
          type: string
          enum: [SHOT, TURNOVER, REBOUND, FOUL, FREE_THROW]
        outcome:
          type: string
        primaryPlayerId:
          type: string
        assistPlayerId:
          type: string
          description: >-
            The TEAMMATE participant — an optional assister on a made-FG SHOT event
            (§3.4). Null on unassisted makes and every non-SHOT event (#022 B,
            surfaced #024 D). Deliberately NOT the same column as opponentPlayerId
            (#041 D): an assister collaborates and is on the SAME team, a
            counterparty opposes and is on the OTHER team.
        opponentPlayerId:
          type: string
          description: >-
            The COUNTERPARTY — the player on the other side of the play from
            primaryPlayerId, and therefore ALWAYS on the opposite team, so a reader
            resolves their team as whichever of offenseTeamId/defenseTeamId primary
            is not on (§3.18, #041 A). Carries the stealer on TURNOVER/STOLEN, the
            blocker on SHOT/BLOCKED_*, and the fouled shooter on FOUL/SHOOTING_FOUL
            (where primaryPlayerId is the defender who committed it). Null on every
            other event, including deliberately on OFFENSIVE_FOUL — the
            charge-drawer is not modelled. A teammate never appears here (#041 D).
        committingTeamId:
          type: string
          description: >-
            Which team COMMITTED this event (§3.10, #028 D). Set on every FOUL event
            — SHOOTING_FOUL carries the defender's team, and the two-sided
            REBOUNDING_FOUL_* carries whichever side the roll picked, since a
            rebounding foul can be an offensive over-the-back and the committer is
            therefore not implied by defenseTeamId. Null on every non-foul event.
            Surfaced by §3.18, closing #028 D's open follow-up.

    GameResult:
      type: object
      description: The shared "here's your game" object — same shape for simulate
        and get (#024 A). The event log is NOT included; play-by-play is its own
        endpoint, so this payload stays bounded (~30 stat lines).
      properties:
        game:
          $ref: "#/components/schemas/Game"
        homeBoxScore:
          type: array
          items:
            $ref: "#/components/schemas/BoxScore"
        awayBoxScore:
          type: array
          items:
            $ref: "#/components/schemas/BoxScore"
        homeTeamStats:
          $ref: "#/components/schemas/TeamGameStats"
        awayTeamStats:
          $ref: "#/components/schemas/TeamGameStats"

    StatTotals:
      type: object
      description: Summed counting stats. rebounds = offensiveRebounds + defensiveRebounds.
      properties:
        points:
          type: integer
          format: int32
        rebounds:
          type: integer
          format: int32
        offensiveRebounds:
          type: integer
          format: int32
        defensiveRebounds:
          type: integer
          format: int32
        assists:
          type: integer
          format: int32
        steals:
          type: integer
          format: int32
        blocks:
          type: integer
          format: int32
        turnovers:
          type: integer
          format: int32
        fouls:
          type: integer
          format: int32
        technicalFouls:
          type: integer
          format: int32
        minutes:
          type: integer
          format: int32
        fieldGoalsAttempted:
          type: integer
          format: int32
        fieldGoalsMade:
          type: integer
          format: int32
        threePointersAttempted:
          type: integer
          format: int32
        threePointersMade:
          type: integer
          format: int32
        freeThrowsAttempted:
          type: integer
          format: int32
        freeThrowsMade:
          type: integer
          format: int32

    StatAverages:
      type: object
      description: Per-game averages of StatTotals, unrounded.
      properties:
        points:
          type: number
          format: double
        rebounds:
          type: number
          format: double
        offensiveRebounds:
          type: number
          format: double
        defensiveRebounds:
          type: number
          format: double
        assists:
          type: number
          format: double
        steals:
          type: number
          format: double
        blocks:
          type: number
          format: double
        turnovers:
          type: number
          format: double
        fouls:
          type: number
          format: double
        technicalFouls:
          type: number
          format: double
        minutes:
          type: number
          format: double
        fieldGoalsAttempted:
          type: number
          format: double
        fieldGoalsMade:
          type: number
          format: double
        threePointersAttempted:
          type: number
          format: double
        threePointersMade:
          type: number
          format: double
        freeThrowsAttempted:
          type: number
          format: double
        freeThrowsMade:
          type: number
          format: double

    ShootingPercentages:
      type: object
      description: Fractions (0–1) from summed makes and attempts; null when the
        denominator is 0. TS% = PTS / (2 × (FGA + 0.44 × FTA)); eFG% = (FGM + 0.5 × 3PM) / FGA.
      properties:
        fieldGoalPct:
          type: number
          format: double
        threePointPct:
          type: number
          format: double
        freeThrowPct:
          type: number
          format: double
        trueShootingPct:
          type: number
          format: double
        effectiveFieldGoalPct:
          type: number
          format: double

    PlayerStats:
      type: object
      properties:
        playerId:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        gamesStarted:
          type: integer
          format: int32
        totals:
          $ref: "#/components/schemas/StatTotals"
        perGame:
          $ref: "#/components/schemas/StatAverages"
        shooting:
          $ref: "#/components/schemas/ShootingPercentages"

    GameLogEntry:
      type: object
      properties:
        gameId:
          type: string
        playedAt:
          type: string
          format: date-time
        teamId:
          type: string
        opponentTeamId:
          type: string
        home:
          type: boolean
        teamScore:
          type: integer
          format: int32
        opponentScore:
          type: integer
          format: int32
        started:
          type: boolean
        boxScore:
          $ref: "#/components/schemas/BoxScore"

    TeamGameStats:
      type: object
      description: One team's line for one game. Ratings are per 100 possessions;
        pace is possessions per 48 minutes.
      properties:
        teamId:
          type: string
        totals:
          $ref: "#/components/schemas/StatTotals"
        possessions:
          type: integer
          format: int32
        pace:
          type: number
          format: double
        offensiveRating:
          type: number
          format: double
        defensiveRating:
          type: number
          format: double
        netRating:
          type: number
          format: double

    TeamStats:
      type: object
      description: A team's aggregates and its opponents' over all FINAL games.
        No win–loss record (standings are Phase 5).
      properties:
        teamId:
          type: string
        gamesPlayed:
          type: integer
          format: int32
        possessions:
          type: integer
          format: int32
        pace:
          type: number
          format: double
        offensiveRating:
          type: number
          format: double
        defensiveRating:
          type: number
          format: double
        netRating:
          type: number
          format: double
        totals:
          $ref: "#/components/schemas/StatTotals"
        perGame:
          $ref: "#/components/schemas/StatAverages"
        opponentTotals:
          $ref: "#/components/schemas/StatTotals"
        opponentPerGame:
          $ref: "#/components/schemas/StatAverages"

    LeaderCategory:
      type: string
      description: Counting categories rank the per-game average among players
        with 70% of the most team games. TECHNICAL_FOULS is the exception — the
        total, with no qualifier. Percentages rank the season fraction among players
        with enough makes per team game (FGM for FG%, TS% and eFG%; 3PM; FTM).
      enum: [POINTS, REBOUNDS, OFFENSIVE_REBOUNDS, DEFENSIVE_REBOUNDS, ASSISTS,
             STEALS, BLOCKS, TURNOVERS, MINUTES, FOULS, TECHNICAL_FOULS,
             FIELD_GOAL_PCT, THREE_POINT_PCT, FREE_THROW_PCT, TRUE_SHOOTING_PCT,
             EFFECTIVE_FIELD_GOAL_PCT]

    LeaderBoard:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/LeaderCategory"
        basis:
          type: string
          enum: [PER_GAME, TOTAL, PERCENTAGE]
        entries:
          type: array
          items:
            $ref: "#/components/schemas/LeaderEntry"

    LeaderEntry:
      type: object
      description: Ties share a rank; within a tie, more games played first, then player id.
      properties:
        rank:
          type: integer
          format: int32
        playerId:
          type: string
        playerName:
          type: string
        teamId:
          type: string
          description: The team of the player's most recent game.
        gamesPlayed:
          type: integer
          format: int32
        value:
          type: number
          format: double
        totals:
          $ref: "#/components/schemas/StatTotals"

    GameHighCategory:
      type: string
      enum: [POINTS, REBOUNDS, OFFENSIVE_REBOUNDS, DEFENSIVE_REBOUNDS, ASSISTS,
             STEALS, BLOCKS, TURNOVERS, MINUTES, FOULS, TECHNICAL_FOULS,
             FIELD_GOALS_MADE, THREE_POINTERS_MADE, FREE_THROWS_MADE]

    GameHighs:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/GameHighCategory"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/GameHighEntry"

    GameHighEntry:
      type: object
      description: Ties share a rank; within a tie, earliest playedAt first, then game id.
      properties:
        rank:
          type: integer
          format: int32
        playerId:
          type: string
        playerName:
          type: string
        teamId:
          type: string
        opponentTeamId:
          type: string
        gameId:
          type: string
        playedAt:
          type: string
          format: date-time
        value:
          type: integer
          format: int32
